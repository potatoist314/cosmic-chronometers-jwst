# Astro lab notebook on TrueNAS. nginx binds loopback and the gateway of the
# newt bridge (ix-newt_default, 172.16.12.0/24). The internet reaches it as
# https://wiki.eclw.org/ through Pangolin on the VPS: traefik -> gerbil
# WireGuard -> newt on this box -> 172.16.12.1:8765. Nothing binds the LAN.
# /srv/project is the copy of the project tree that scripts/publish_wiki.py
# sends from the Mac; the python service beside this one (docker-compose.yml)
# builds wiki/public there and answers the research activity API.

map "$request_method|$http_origin" $wiki_write_denied {
    default 0;
    "~^POST\|(?!https://(wiki\.eclw\.org|truenas-scale\.tail5c940d\.ts\.net:8765)$)" 1;
}

server {
    listen 127.0.0.1:8765;
    listen 172.16.12.1:8765;
    server_name _;
    absolute_redirect off;
    client_max_body_size 25m;
    add_header Cache-Control "no-cache" always;
    # The Review Inbox on the Mac counts note opens from this log.
    access_log /srv/logs/access.log;

    charset utf-8;
    charset_types text/plain text/css text/csv text/markdown text/x-python application/javascript application/json;
    include /etc/nginx/mime.types;
    types {
        application/javascript      mjs;
        text/csv                    csv;
        text/tab-separated-values   tsv;
        text/markdown               md;
        text/plain                  log;
        text/x-python               py;
        application/x-ipynb+json    ipynb;
        application/x-hdf5          h5;
        application/manifest+json   webmanifest;
    }

    # serve_wiki.py in the python service, same host network.
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 500s;

    location / {
        root /srv/project/wiki/public;
        index index.html;
    }

    # Links from before 2026-09-18 carried a /wiki/ prefix.
    location /wiki/ {
        rewrite ^/wiki/(.*)$ /$1 permanent;
    }

    location /f/ {
        alias /srv/project/;
        autoindex on;
    }

    location /api/ {
        if ($wiki_write_denied) { return 403; }
        proxy_pass http://127.0.0.1:8766;
    }

    location = /ask {
        if ($wiki_write_denied) { return 403; }
        proxy_pass http://127.0.0.1:8766;
    }
}
