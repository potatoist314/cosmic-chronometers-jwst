# Astro lab notebook on TrueNAS. nginx binds loopback only; the tailnet reaches
# it through Tailscale Serve at https://truenas-scale.tail5c940d.ts.net:8765/wiki/.
# Pages and linked files are the copies scripts/publish_wiki.py sends from the Mac.
# The question box, the research activity API and any linked file that is not
# mirrored go to the Mac's own wiki server, which answers while the Mac is awake.

map "$request_method|$http_origin" $wiki_write_denied {
    default 0;
    "~^POST\|(?!https://truenas-scale\.tail5c940d\.ts\.net:8765$)" 1;
}

server {
    listen 127.0.0.1:8765;
    server_name _;
    absolute_redirect off;
    client_max_body_size 25m;
    add_header Cache-Control "no-cache" always;

    charset utf-8;
    charset_types text/plain text/css text/csv text/markdown text/x-python application/javascript application/json;
    include /etc/nginx/mime.types;
    types {
        application/javascript      mjs;
        text/csv                    csv;
        text/tab-separated-values   tsv;
        text/markdown               md;
        text/plain                  log;
        text/x-python               py;
        application/x-ipynb+json    ipynb;
        application/x-hdf5          h5;
        application/manifest+json   webmanifest;
    }

    # The Mac's Tailscale Serve route, by address: this host has no MagicDNS.
    proxy_ssl_server_name on;
    proxy_ssl_name liu-haos-macbook-pro.tail5c940d.ts.net;
    proxy_set_header Host liu-haos-macbook-pro.tail5c940d.ts.net;
    proxy_set_header Origin https://liu-haos-macbook-pro.tail5c940d.ts.net;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 500s;

    location = /     { return 302 /wiki/; }
    location = /wiki { return 302 /wiki/; }
    location /       { return 404; }

    location /wiki/ {
        alias /srv/wiki/public/;
        index index.html;
    }

    location /wiki/f/ {
        alias /srv/wiki/files/;
        autoindex on;
        error_page 404 = @mac;
    }

    location /wiki/api/ {
        if ($wiki_write_denied) { return 403; }
        proxy_pass https://100.101.98.113;
    }

    location = /wiki/ask {
        if ($wiki_write_denied) { return 403; }
        proxy_pass https://100.101.98.113;
    }

    location @mac {
        proxy_pass https://100.101.98.113;
    }
}
