# Astro lab notebook on TrueNAS. nginx binds loopback only; the tailnet reaches
# it through Tailscale Serve at https://truenas-scale.tail5c940d.ts.net:8765/wiki/.
# /srv/project is the copy of the project tree that scripts/publish_wiki.py
# sends from the Mac; the python service beside this one (docker-compose.yml)
# builds wiki/public there and answers the research activity API.

map "$request_method|$http_origin" $wiki_write_denied {
    default 0;
    "~^POST\|(?!https://truenas-scale\.tail5c940d\.ts\.net:8765$)" 1;
}

server {
    listen 127.0.0.1:8765;
    server_name _;
    absolute_redirect off;
    client_max_body_size 25m;
    add_header Cache-Control "no-cache" always;
    # The Review Inbox on the Mac counts note opens from this log.
    access_log /srv/logs/access.log;

    charset utf-8;
    charset_types text/plain text/css text/csv text/markdown text/x-python application/javascript application/json;
    include /etc/nginx/mime.types;
    types {
        application/javascript      mjs;
        text/csv                    csv;
        text/tab-separated-values   tsv;
        text/markdown               md;
        text/plain                  log;
        text/x-python               py;
        application/x-ipynb+json    ipynb;
        application/x-hdf5          h5;
        application/manifest+json   webmanifest;
    }

    # serve_wiki.py in the python service, same host network.
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 500s;

    location = /     { return 302 /wiki/; }
    location = /wiki { return 302 /wiki/; }
    location /       { return 404; }

    location /wiki/ {
        alias /srv/project/wiki/public/;
        index index.html;
    }

    location /wiki/f/ {
        alias /srv/project/;
        autoindex on;
    }

    location /wiki/api/ {
        if ($wiki_write_denied) { return 403; }
        proxy_pass http://127.0.0.1:8766;
    }

    location = /wiki/ask {
        if ($wiki_write_denied) { return 403; }
        proxy_pass http://127.0.0.1:8766;
    }
}
