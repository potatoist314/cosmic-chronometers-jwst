# The Astro lab notebook on TrueNAS, in /mnt/apps/applications/astro-wiki.
# scripts/publish_wiki.py on the Mac fills ./public and ./files.
services:
  astro-wiki:
    image: nginx:stable-alpine
    container_name: astro-wiki
    # Host networking so nginx binds 127.0.0.1 only. Tailscale Serve in the
    # Tailscale app, also host networked, carries the tailnet to that port.
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/srv/wiki/public:ro
      - ./files:/srv/wiki/files:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
