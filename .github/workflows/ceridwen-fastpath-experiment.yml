name: Ceridwen fast-path experiment

on:
  push:
    branches:
      - experiment/ceridwen-sfh-basis-fastpath
    paths:
      - "scripts/ceridwen_sfh_basis_fastpath.py"
      - "scripts/benchmark_ceridwen_sfh_basis_fastpath.py"
      - "tests/test_ceridwen_sfh_basis_fastpath.py"
      - "tests/test_benchmark_ceridwen_sfh_basis_fastpath.py"
      - ".github/workflows/ceridwen-fastpath-experiment.yml"
  pull_request:
    paths:
      - "scripts/ceridwen_sfh_basis_fastpath.py"
      - "scripts/benchmark_ceridwen_sfh_basis_fastpath.py"
      - "tests/test_ceridwen_sfh_basis_fastpath.py"
      - "tests/test_benchmark_ceridwen_sfh_basis_fastpath.py"
      - ".github/workflows/ceridwen-fastpath-experiment.yml"

permissions:
  contents: read

jobs:
  credential-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      VASTAI_API_KEY: ${{ secrets.VASTAI_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Report credential availability without revealing values
        shell: bash
        run: |
          if [[ -n "$VAST_API_KEY" ]]; then
            echo "VAST_API_KEY=present"
          else
            echo "VAST_API_KEY=absent"
          fi
          if [[ -n "$VASTAI_API_KEY" ]]; then
            echo "VASTAI_API_KEY=present"
          else
            echo "VASTAI_API_KEY=absent"
          fi
          if [[ -n "$MODAL_TOKEN_ID" && -n "$MODAL_TOKEN_SECRET" ]]; then
            echo "MODAL_CREDENTIALS=present"
          else
            echo "MODAL_CREDENTIALS=absent"
          fi

  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jax[cpu]" numpy pytest ruff

      - name: Compile
        run: |
          python -m compileall -q \
            scripts/ceridwen_sfh_basis_fastpath.py \
            scripts/benchmark_ceridwen_sfh_basis_fastpath.py \
            tests/test_ceridwen_sfh_basis_fastpath.py \
            tests/test_benchmark_ceridwen_sfh_basis_fastpath.py

      - name: Ruff
        run: |
          ruff check \
            scripts/ceridwen_sfh_basis_fastpath.py \
            scripts/benchmark_ceridwen_sfh_basis_fastpath.py \
            tests/test_ceridwen_sfh_basis_fastpath.py \
            tests/test_benchmark_ceridwen_sfh_basis_fastpath.py

      - name: Synthetic equivalence and harness tests
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
        run: |
          python -m pytest -q \
            tests/test_ceridwen_sfh_basis_fastpath.py \
            tests/test_benchmark_ceridwen_sfh_basis_fastpath.py
