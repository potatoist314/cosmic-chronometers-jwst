name: Add Vast SSH packages to the Ceridwen GPU image
on:
  push:
    branches: [speedups]
    paths: ['scripts/containers/vast-ssh.Dockerfile', '.github/workflows/ceridwen-image-ssh.yml']
permissions:
  contents: read
  packages: write
env:
  REPOSITORY: potatoist314/ceridwen-gpu
  BASE: sha256:b4881d30b146431bbdb2ec44b39ca931dcf7c6de6a8b26d2b21bc3c52179786b
jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/containers
          filter: blob:none
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: scripts/containers/vast-ssh.Dockerfile
          build-args: BASE=ghcr.io/${{ env.REPOSITORY }}@${{ env.BASE }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/${{ env.REPOSITORY }}:ssh-${{ github.sha }}
      - name: Check the image is the base image plus one layer
        env:
          IMAGE: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repository = os.environ["REPOSITORY"]
          token = json.load(urllib.request.urlopen(f"https://ghcr.io/token?scope=repository:{repository}:pull"))["token"]
          def manifest(digest):
              request = urllib.request.Request(f"https://ghcr.io/v2/{repository}/manifests/{digest}", headers={
                  "Authorization": f"Bearer {token}", "Accept": "application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"})
              return json.load(urllib.request.urlopen(request))
          base, image = manifest(os.environ["BASE"]), manifest(os.environ["IMAGE"])
          layers = [layer["digest"] for layer in image["layers"]]
          assert layers[:-1] == [layer["digest"] for layer in base["layers"]], "base layers changed"
          line = f"{os.environ['IMAGE']}: base {os.environ['BASE']} plus one layer of {image['layers'][-1]['size']:,} bytes"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(line + "\n")
          PY
