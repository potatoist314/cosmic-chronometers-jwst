name: Leave NCCL and NVSHMEM out of the Ceridwen GPU image
on:
  push:
    branches: [speedups]
    paths: ['scripts/containers/drop_image_layers.py', '.github/workflows/ceridwen-image-trim.yml']
permissions:
  contents: read
  packages: write
env:
  REPOSITORY: potatoist314/ceridwen-gpu
  SOURCE: sha256:6565b52d486cfe82cd17f6f2bd928b45529576d32b6dc52734c4549a953ed1a1
  NVIDIA: opt/ceridwen/lib/python3.11/site-packages/nvidia
jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/containers
          filter: blob:none
      - name: Free disk for two unpacked images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Leave out the layers that hold only NCCL and NVSHMEM
        id: trim
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="trim-${SOURCE#sha256:}"
          digest=$(python3 scripts/containers/drop_image_layers.py "$REPOSITORY" "$SOURCE" "${tag:0:17}" "$NVIDIA/nccl/lib" "$NVIDIA/nvshmem/lib")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Check the images differ only by those two directories
        env:
          TRIM: ${{ steps.trim.outputs.digest }}
        run: |
          listing() {
            docker pull -q --platform linux/amd64 "ghcr.io/$REPOSITORY@$1" > /dev/null
            docker inspect -f '{{json .Config}}' "ghcr.io/$REPOSITORY@$1"
            id=$(docker create --platform linux/amd64 "ghcr.io/$REPOSITORY@$1")
            docker export "$id" | python3 -c '
          import hashlib, sys, tarfile
          with tarfile.open(fileobj=sys.stdin.buffer, mode="r|") as tar:
              for m in tar:
                  digest = hashlib.file_digest(tar.extractfile(m), "sha256").hexdigest() if m.isfile() else ""
                  # Directory times and the files docker create writes differ between any two containers.
                  created = (".dockerenv", "dev/console", "etc/hostname", "etc/hosts", "etc/mtab", "etc/resolv.conf")
                  mtime = "" if m.isdir() or m.name in created else m.mtime
                  print(repr(m.name), m.type, oct(m.mode), m.uid, m.gid, m.size, mtime, repr(m.linkname), digest)
          ' | sort
            docker rm "$id" > /dev/null
            docker rmi "ghcr.io/$REPOSITORY@$1" > /dev/null
          }
          listing "$SOURCE" > source.txt
          listing "$TRIM" > trim.txt
          diff source.txt trim.txt > changes.txt || true
          python3 - <<'PY'
          import os
          lines = [l for l in open("changes.txt") if l[:1] in "<>"]
          keep = tuple(f"'{os.environ['NVIDIA']}/{d}" for d in ("nccl/lib", "nvshmem/lib"))
          assert lines and all(l.startswith("< ") and l[2:].startswith(keep) for l in lines), lines[:5]
          print(f"{len(lines)} entries removed, all under nccl/lib and nvshmem/lib")
          PY
          echo "Trimmed $SOURCE into $TRIM: $(grep -c '^<' changes.txt) entries under nccl/lib and nvshmem/lib removed; nothing else differs" >> "$GITHUB_STEP_SUMMARY"
