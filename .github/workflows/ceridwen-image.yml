name: Build Ceridwen GPU image
on:
  push:
    branches: [absorption-mask]
    paths: ['scripts/containers/**', '.github/workflows/ceridwen-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/containers
          filter: blob:none
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: scripts/containers/ceridwen.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/potatoist314/ceridwen-gpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Copy the image with its venv layer split, so hosts download the parts in parallel
        id: split
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "digest=$(python3 scripts/containers/split_image_layer.py potatoist314/ceridwen-gpu ${{ steps.build.outputs.digest }} ${{ github.sha }}-split)" >> "$GITHUB_OUTPUT"
      - name: Add the packages Vast's SSH launch installs, so hosts skip that install
        uses: docker/build-push-action@v6
        id: ssh
        with:
          context: .
          file: scripts/containers/vast-ssh.Dockerfile
          build-args: BASE=ghcr.io/potatoist314/ceridwen-gpu@${{ steps.split.outputs.digest }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/potatoist314/ceridwen-gpu:${{ github.sha }}-ssh
      - name: Leave out the NCCL and NVSHMEM layers, which one-GPU fits never call
        id: trim
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA: opt/ceridwen/lib/python3.11/site-packages/nvidia
        run: echo "digest=$(python3 scripts/containers/drop_image_layers.py potatoist314/ceridwen-gpu ${{ steps.ssh.outputs.digest }} ${{ github.sha }}-trim "$NVIDIA/nccl/lib" "$NVIDIA/nvshmem/lib")" >> "$GITHUB_OUTPUT"
      - run: echo 'Image digest ${{ steps.build.outputs.digest }}; split layers ${{ steps.split.outputs.digest }}; with Vast SSH packages ${{ steps.ssh.outputs.digest }}; without NCCL and NVSHMEM ${{ steps.trim.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
