name: Build Ceridwen GPU image
on:
  push:
    branches: [absorption-mask]
    paths: ['scripts/containers/**', '.github/workflows/ceridwen-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/containers
          filter: blob:none
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: scripts/containers/ceridwen.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/potatoist314/ceridwen-gpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo 'Image digest ${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
